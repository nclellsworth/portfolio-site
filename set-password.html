<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set your password | Nicole Ellsworth</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="assets/portal.css">
  <link rel="stylesheet" href="assets/navigation.css">
</head>
<body>
  <div class="site">
    <nav>
      <a class="nav-name" href="index.html">Nicole Ellsworth</a>
      <ul class="nav-links">
        <li><a href="ArtLessons.html">Art Lessons</a></li>
        <li><a href="art.html">Art</a></li>
        <li><a href="writing.html">Writing</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="student-login.html">Student Login</a></li>
      </ul>
    </nav>
    <main class="portal-shell">
      <section class="portal-panel compact">
        <div class="eyebrow">Your invitation</div>
        <h1>Set your password</h1>
        <p class="muted">Open this page using the invitation link sent to your email.</p>
        <form id="set-password-form" class="hidden">
          <label for="password">New password (at least 12 characters)</label>
          <input id="password" type="password" autocomplete="new-password" minlength="12" required>
          <label for="confirm-password">Confirm new password</label>
          <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required>
          <button type="submit" id="save-password">Set password</button>
        </form>
        <p id="status" class="status" role="status" aria-live="polite">Checking your invitation…</p>
        <a href="student-login.html">Return to student login</a>
      </section>
    </main>
    <footer>© 2026 Nicole Ellsworth</footer>
  </div>
  <script type="module" src="assets/set-password.js"></script>
</body>
</html>
